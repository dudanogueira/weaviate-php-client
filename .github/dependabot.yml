version: 2
updates:
  # Keeps the SHA-pinned actions in .github/workflows current (the "# vX" comments are updated too).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
    versioning-strategy: widen
  - package-ecosystem: docker
    directory: /docker/php
    schedule:
      interval: monthly
  - package-ecosystem: docker
    directory: /docker/php-grpc
    schedule:
      interval: monthly
